<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="A minimalist love expression">
    <meta name="theme-color" content="#ff6b9d">
    <title>爱意随风起</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 背景装饰 -->
    <div class="background-decoration" id="backgroundDecoration">
        <!-- 月亮装饰 -->
        <div class="moon-decoration">
            <div class="moon"></div>
            <div class="moon-glow"></div>
        </div>
    </div>

    <!-- 主容器 -->
    <main class="main-container">
        <!-- 标题 -->
        <!-- <h1 class="page-title">Forever</h1> -->

        <!-- 副标题 -->
        <p class="page-subtitle">愿时光温柔，愿你被爱</p>

        <!-- 音频控制 -->
        <button class="audio-toggle" id="audioToggle" aria-label="Toggle background music">
            <svg class="audio-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21l6-6H21l-6-6H9v12z"/>
                <path d="M3 9v6l6-3-6-3z"/>
            </svg>
        </button>
    </main>

    <!-- 背景音乐 -->
    <audio id="bgMusic" preload="none" loop>
        <source src="static/music/Ed Sheeran-Thinking Out Loud.mp3" type="audio/mp3">
    </audio>

    <!-- 现代JavaScript -->
    <script type="module" src="static/js/main.js"></script>
</body>
</html>
