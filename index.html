<body>
  <!-- 底层：WebGL2 着色器天空（渐变 / 极光 / 月亮 / 流星） -->
  <canvas id="sky" class="layer sky" aria-hidden="true"></canvas>

  <!-- 上层：交互星空（连线星座 / 粒子 / 拖尾），唯一指针交互层 -->
  <canvas id="stage" class="layer stage" role="img" aria-label="交互星图：轻触有星光回应，三连击会有流星雨"></canvas>

  <!-- 音乐球：轻触播放/暂停 · 双击下一首 · 长按上一首（环形频谱可视化） -->
  <button id="audioFab" class="fab" aria-label="播放或暂停背景音乐（双击下一首，长按上一首）" aria-pressed="false">
    <canvas id="fabViz" class="fab-viz" aria-hidden="true"></canvas>
    <svg class="fab-icon icon-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
    <svg class="fab-icon icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
  </button>

  <audio id="audio" preload="none"></audio>
